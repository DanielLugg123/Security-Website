<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<h1>Checkout</h1>

<form id="checkoutForm">
  <label>Name:</label>
  <input type="text" id="name">

  <label>Address:</label>
  <input type="text" id="address">

  <label>Checkout Amount</label>
  <input type="number" id="checkout amount">

  <button type="submit">Confirm</button>
  <button type="button" onclick="clearcheckout()">Clear All</button>
  <button type="button" onclick="closecheckout()">Close</button>
</form>

<p id="msg"></p>

<script src="../script.js"></script>
</body>
</html>
